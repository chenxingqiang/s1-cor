# CoR Theory ↔ Code Contract Matrix
# Used by AGENTS.md infinite optimization loop (感知 / 验证 / 进化).
# Tiers: implemented | partial | heuristic | deferred | unsupported

version: 1
paper_claims:
  sample_efficiency: "1K samples → competitive with o1-preview (README Results table)"
  benchmarks: [AIME24, MATH500, GPQA]
  core_formula: "R = R_ext + λ·R_int + μ·R_improve + ν·R_converge"

components:
  - id: total_reward_formula
    theory: "theory.md §1, design.md §2.1"
    code: "s1-cor/train/rewards/calculator.py:calculate_reflection_reward"
    tier: implemented
    verify: "pytest train/rewards/test_rewards.py::TestReflectionRewards"

  - id: five_dim_intrinsic
    theory: "theory.md §2, target.md §3.1"
    code: "s1-cor/train/rewards/intrinsic.py:IntrinsicRewardCalculator"
    tier: heuristic
    notes: "Rule-based proxies; not learned Q_φ or LLM-as-judge"
    verify: "pytest train/rewards/test_rewards.py::TestIntrinsicRewards"

  - id: self_rating_calibration
    theory: "theory.md §3, design.md §2.3"
    code: "s1-cor/train/rewards/self_rating.py:SelfRatingEvaluator.compute_calibration"
    tier: implemented
    verify: "pytest train/rewards/test_rewards.py::TestSelfRatingEvaluator"

  - id: improvement_reward
    theory: "theory.md §9-10, design.md §2.4"
    code: "s1-cor/train/rewards/intrinsic.py:ImprovementRewardCalculator"
    tier: implemented
    verify: "pytest train/rewards/test_rewards.py::TestReflectionRewards"

  - id: convergence_reward
    theory: "target.md §2.2 exp(-α‖Δc‖)"
    code: "s1-cor/train/rewards/intrinsic.py:ConvergenceRewardCalculator"
    tier: implemented
    notes: "‖Δc‖ proxied by normalized L1 on intrinsic dim scores; α via RewardConfig.convergence_alpha"
    verify: "pytest train/rewards/test_rewards.py::TestReflectionRewards"

  - id: ablation_sweep
    theory: "design.md §9 ablation table; matrix ablations_documented"
    code: "s1-cor/scripts/run_ablation_sweep.py"
    tier: implemented
    notes: "CPU reward-only λ/μ/α sweep before GPU GRPO"
    verify: "pytest train/test_ablation_sweep.py"

  - id: token_level_reward_chain
    theory: "target.md §1-2 CoR(τ)=Σ γ^t r_int(s_t,a_t)"
    code: null
    tier: deferred
    notes: "Training uses chain-level scalar R_int, not per-token shaping"

  - id: dual_coupling_phi
    theory: "theory.md §5-6 φ_{t+1} gradient on calibration"
    code: null
    tier: deferred
    notes: "Only θ updated via GRPO; no separate calibration head φ"

  - id: grpo_integration
    theory: "theory.md §13-14, design.md §6.2"
    code: "s1-cor/train/grpo.py:create_reward_fn"
    tier: implemented
    verify: "pytest train/test_grpo.py"

  - id: multi_round_reflection_data
    theory: "design.md §7.2, theory.md §14"
    code: "s1-cor/train/reflection_parsing.py"
    tier: implemented
    notes: "[Round N] completions; thinking_trajectories; s1K self-rating checkpoint splits"
    verify: "pytest train/test_reflection_parsing.py; validate_cor_logic --dataset deepseek"

  - id: external_reward
    theory: "R_ext = 1[y_answer = y_gt]"
    code: "s1-cor/train/rewards/calculator.py:calculate_external_reward"
    tier: heuristic
    notes: "String/normalized match; eval uses lm-eval + OpenAI for MATH/GPQA"

  - id: sft_self_rating_format
    theory: "design.md §6.1"
    code: "s1-cor/train/sft_small.py"
    tier: implemented
    verify: "colab_minimal.sh verify; --colab smoke on GPU"

  - id: dataset_local_load
    theory: "s1K-cor 1K reasoning traces"
    code: "s1-cor/train/data_utils.py:load_cor_dataset_from_disk"
    tier: implemented
    verify: "pytest train/test_data_utils.py; validate_cor_logic --dataset deepseek"

  - id: benchmark_reproduction
    theory: "design.md §9, README Results"
    code: "s1-cor/eval/commands.sh + lm-evaluation-harness"
    tier: deferred
    notes: "Requires CUDA, vLLM, checkpoints (ckpts/ not bundled)"
    verify: "cd s1-cor && python scripts/check_eval_readiness.py --json"

  - id: eval_readiness_gate
    theory: "AGENTS.md merge gate for paper numbers"
    code: "s1-cor/scripts/check_eval_readiness.py"
    tier: implemented
    notes: "CPU-safe prerequisite report; exit 0 only when GPU eval can run"
    verify: "pytest train/test_eval_scripts.py::test_check_eval_readiness_json"

ablations_documented:
  - name: lambda_intrinsic
    sweep: [0.0, 0.5, 1.0, 2.0]
    status: script_cpu
    run: "cd s1-cor && python scripts/run_ablation_sweep.py --json"
  - name: improvement_weight_mu
    sweep: [0.0, 0.25, 0.5, 1.0]
    status: script_cpu
    run: "cd s1-cor && python scripts/run_ablation_sweep.py --json"
  - name: convergence_alpha
    sweep: [0.5, 1.0, 2.0]
    status: script_cpu
    run: "cd s1-cor && python scripts/run_ablation_sweep.py --json"
  - name: reflection_rounds_K
    sweep: [1, 2, 3, 4]
    status: script_cpu
    run: "cd s1-cor && python scripts/run_reflection_k_ablation.py --json"
  - name: sft_only_vs_cor_grpo
    status: script_cpu
    run: "cd s1-cor && python scripts/run_reflection_k_ablation.py --json (design_md_stage_presets)"
